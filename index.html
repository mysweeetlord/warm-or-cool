<style>
:root{--bg:#f4f1ec;--ink:#2e2b2c;--soft:#7a7274;--line:#ddd6cf;--card:#faf8f5;--rose:#a7787a;--ok:#5f7a63;--no:#9a5a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 -apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.01em;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 -webkit-user-select:none;user-select:none}
.serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
.wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:22px 22px 28px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:44px;line-height:1.05;margin:18px 0 4px;letter-spacing:.01em}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:28px;margin:0}
.sub{color:var(--soft);margin:0 0 26px}
.small{font-size:13px;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.lvl{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:18px 0;border-top:1px solid var(--line)}
.lvl[data-l="3"]{border-bottom:1px solid var(--line)}
.lvl .t{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px}
.lvl .d{color:var(--soft);font-size:14px}
.lvl[disabled]{opacity:.38}
.lvl .st{font-size:13px;color:var(--soft);white-space:nowrap;margin-left:12px}
.link{color:var(--rose);font-size:15px;text-decoration:underline;text-underline-offset:3px;margin-top:22px;align-self:flex-start}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.back{font-size:15px;color:var(--soft);padding:6px 0}
.meta{display:flex;gap:16px;font-size:13px;color:var(--soft)}
.prompt{margin:4px 0 14px}
.stage{flex:1;display:flex;flex-direction:column;min-height:0}
.swatch{flex:1;min-height:300px;border-radius:4px;border:1px solid rgba(0,0,0,.06);transition:background-color .35s ease}
.pair{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:300px}
.pair button{border-radius:4px;border:1px solid rgba(0,0,0,.06);position:relative}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.grid button{border-radius:4px;border:1px solid rgba(0,0,0,.06);min-height:108px;position:relative}
.tag{position:absolute;left:8px;bottom:8px;background:rgba(250,248,245,.92);color:var(--ink);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.tag:empty{display:none}
.mark{position:absolute;right:8px;top:8px;background:rgba(250,248,245,.92);font-size:12px;padding:2px 7px;border-radius:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn{border:1px solid var(--ink);border-radius:3px;padding:15px 0;font-size:16px;letter-spacing:.08em;text-transform:uppercase;text-align:center;width:100%}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.35}
.fb{min-height:74px;margin-top:14px;font-size:15px;color:var(--ink)}
.fb b{font-weight:600}
.fb .r{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;display:block;margin-bottom:2px}
.ok{color:var(--ok)}.no{color:var(--no)}
.chosen{outline:2px solid var(--ink);outline-offset:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px}
.card p{margin:0 0 12px}
.strip{display:flex;height:34px;margin:6px 0 16px;border-radius:2px;overflow:hidden}
.strip span{flex:1}
.done{text-align:center;margin:auto 0}
.done .big{font-family:"Cormorant Garamond",Georgia,serif;font-size:64px;line-height:1}
.hide{display:none!important}
</style>
</head>

 h(`<h1>Warm or Cool</h1><p class="sub">A quiet way to train your eye for color temperature.</p>
 ${LEVELS.map(l=>{const locked=l.id>S.unlocked;const b=S.best[l.id];
  return `<button class="lvl" data-l="${l.id}" ${locked?"disabled":""}><span><span class="t">${l.id}. ${l.title}</span><br><span class="d">${l.desc}</span></span>
  <span class="st">${locked?"Locked":(b!=null?"Best "+b+"/"+ROUNDS:"Begin")}</span></button>`}).join("")}
 <button class="link" id="how">How to tell</button>
 <p class="small" style="margin-top:auto;padding-top:30px">Score ${PASS} of ${ROUNDS} to open the next level</p>`);
 app.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>start(+b.dataset.l));
 document.getElementById("how").onclick=how;
}
function how(){
 h(`<div class="top"><button class="back" id="bk">&larr; Back</button></div>
 <div class="card"><h2 style="margin-bottom:12px">How to tell</h2>
 <p><b>Warm</b> colors lean toward red, orange and yellow.</p>
 <div class="strip"><span style="background:#c73f15"></span><span style="background:#d8742e"></span><span style="background:#e2a93b"></span><span style="background:#dc8c81"></span><span style="background:#999186"></span></div>
 <p><b>Cool</b> colors lean toward blue, green and violet.</p>
 <div class="strip"><span style="background:#48589b"></span><span style="background:#088871"></span><span style="background:#6c58ad"></span><span style="background:#d38bb0"></span><span style="background:#89949d"></span></div>
 <p>Temperature is also <i>relative</i>. Any color can be warmer or cooler than its neighbor: a pink that leans toward peach is warmer than a pink that leans toward lilac, and a gray with a brown undertone is warmer than a bluish gray.</p>
 <p style="margin:0">Ask yourself: which way is it leaning, toward the orange side or the blue side?</p></div>`);
 document.getElementById("bk").onclick=home;
}

let G;
function start(lv){
 G={lv,round:0,score:0,streak:0,bestStreak:0,answered:false};
 if(lv===1)G.items=shuffle(DATA.l1).slice(0,ROUNDS);
 if(lv===2){let p=shuffle(DATA.l2);while(p.length<ROUNDS)p=p.concat(shuffle(DATA.l2));G.items=p.slice(0,ROUNDS).map(x=>({...x,warmLeft:Math.random()<.5}))}
 if(lv===3){G.items=[];for(let i=0;i<ROUNDS;i++){const w=shuffle(DATA.l3.filter(x=>x.warm)),c=shuffle(DATA.l3.filter(x=>!x.warm));const nw=2+Math.floor(Math.random()*3);G.items.push(shuffle(w.slice(0,nw).concat(c.slice(0,6-nw))))}}
 round();
}
function header(){const L=LEVELS[G.lv-1];
 return `<div class="top"><button class="back" id="bk">&larr; Levels</button>
 <div class="meta"><span>Round ${G.round+1}/${ROUNDS}</span><span>Score ${G.score}</span><span>Streak ${G.streak}</span></div></div>
 <h2 class="prompt">${L.title}</h2>`}
function wire(){document.getElementById("bk").onclick=home}
function fbHTML(ok,msg){return `<span class="r ${ok?"ok":"no"}">${ok?(G.streak>=3?"Lovely, "+G.streak+" in a row.":"Yes."):"Not quite."}</span>${msg}`}
function nextBtn(){return `<button class="btn solid hide" id="nx" style="margin-top:12px">${G.round+1<ROUNDS?"Next":"See results"}</button>`}
function scoreIt(ok){G.answered=true;if(ok){G.score++;G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak)}else G.streak=0;
 app.querySelector(".meta").innerHTML=`<span>Round ${G.round+1}/${ROUNDS}</span><span>Score ${G.score}</span><span>Streak ${G.streak}</span>`;
 const n=document.getElementById("nx");n.classList.remove("hide");n.onclick=()=>{G.round++;G.round<ROUNDS?round():finish()}}

function round(){G.answered=false;const it=G.items[G.round];
 if(G.lv===1){
  h(header()+`<div class="stage"><div class="swatch" style="background:${it.hex}"></div>
  <div class="row" id="ch"><button class="btn" data-w="1">Warm</button><button class="btn" data-w="0">Cool</button></div>
  <div class="fb" id="fb"></div>${nextBtn()}</div>`);wire();
  app.querySelectorAll("#ch .btn").forEach(b=>b.onclick=()=>{if(G.answered)return;const ok=(+b.dataset.w)===it.warm;
   b.classList.add("chosen");app.querySelectorAll("#ch .btn").forEach(x=>x.disabled=true);
   document.getElementById("fb").innerHTML=fbHTML(ok,it.why);scoreIt(ok)});
 }
 if(G.lv===2){const L=it.warmLeft?it.warm:it.cool,R=it.warmLeft?it.cool:it.warm;
  h(header()+`<p class="small" style="margin:-6px 0 12px">Tap the warmer ${it.fam.replace(/s$/,"")}</p><div class="stage"><div class="pair">
  <button data-s="L" style="background:${L}"><span class="tag"></span></button><button data-s="R" style="background:${R}"><span class="tag"></span></button></div>
  <div class="fb" id="fb"></div>${nextBtn()}</div>`);wire();
  const bs=app.querySelectorAll(".pair button");
  bs.forEach(b=>b.onclick=()=>{if(G.answered)return;const pickedWarm=(b.dataset.s==="L")===it.warmLeft;
   b.classList.add("chosen");bs.forEach(x=>{const isW=(x.dataset.s==="L")===it.warmLeft;x.querySelector(".tag").textContent=isW?"Warmer":"Cooler"});
   document.getElementById("fb").innerHTML=fbHTML(pickedWarm,it.why);scoreIt(pickedWarm)});
 }
 if(G.lv===3){const marks=Array(6).fill(null);
  h(header()+`<p class="small" style="margin:-6px 0 12px">Tap each swatch to mark it warm or cool</p><div class="stage"><div class="grid">
  ${it.map((s,i)=>`<button data-i="${i}" style="background:${s.hex}"><span class="tag"></span></button>`).join("")}</div>
  <button class="btn solid" id="chk" style="margin-top:16px" disabled>Check</button>
  <div class="fb" id="fb"></div>${nextBtn()}</div>`);wire();
  const bs=app.querySelectorAll(".grid button"),chk=document.getElementById("chk");
  bs.forEach(b=>b.onclick=()=>{if(G.answered)return;const i=+b.dataset.i;marks[i]=marks[i]===null?1:marks[i]===1?0:null;
   b.querySelector(".tag").textContent=marks[i]===null?"":marks[i]?"Warm":"Cool";chk.disabled=marks.some(m=>m===null)});
  chk.onclick=()=>{if(G.answered)return;let right=0,miss=[];
   it.forEach((s,i)=>{const ok=marks[i]===s.warm;if(ok)right++;else miss.push(s);
    const m=document.createElement("span");m.className="mark "+(ok?"ok":"no");m.textContent=ok?"✓":"✕";bs[i].appendChild(m)});
   chk.classList.add("hide");const ok=right===6;
   const msg=ok?"All six sorted correctly.":`${right} of 6. `+miss.slice(0,2).map(s=>`The ${s.name} ${s.lean}, so it's ${s.warm?"warm":"cool"}.`).join(" ");
   document.getElementById("fb").innerHTML=fbHTML(ok,msg);scoreIt(ok)};
 }
}
function finish(){const lv=G.lv;S.best[lv]=Math.max(S.best[lv]||0,G.score);let opened=false;
 if(G.score>=PASS&&S.unlocked<=lv&&lv<3){S.unlocked=lv+1;opened=true}save();
 h(`<div class="done"><p class="small">${LEVELS[lv-1].title}</p><div class="big">${G.score}<span style="font-size:32px;color:var(--soft)"> / ${ROUNDS}</span></div>
 <p class="sub" style="margin:14px 0 6px">Longest streak: ${G.bestStreak}</p>
 <p style="margin:0 0 28px">${opened?"Level "+(lv+1)+" is now open.":(G.score>=PASS?"Beautifully done.":"Take your time, then try again. Your eye is learning.")}</p>
 <button class="btn" id="again">Play again</button><div style="height:12px"></div><button class="btn solid" id="hm">Levels</button></div>`);
 document.getElementById("again").onclick=()=>start(lv);document.getElementById("hm").onclick=home;}
const m=location.hash.match(/^#play(\d)$/);m&&+m[1]<=S.unlocked?start(+m[1]):home();
</script>
</body>
</html>
